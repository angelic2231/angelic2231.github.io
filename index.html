<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#030308">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>angelic</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- WebGL Background Canvas -->
  <canvas id="glcanvas"></canvas>

  <!-- Centered Morphing Stage (No Scroll) -->
  <div class="stage-container">
    <div class="morph-card" id="morph-card">
      
      <!-- Collapsed State: Single Center Button -->
      <div class="trigger-view">
        <span class="trigger-text">悄悄话</span>
      </div>

      <!-- Expanded State: Whisper / Question Window -->
      <div class="window-view">
        <div class="card-header">
          <h2 class="card-title">悄悄话</h2>
          <button type="button" class="close-btn" id="close-btn" aria-label="关闭">×</button>
        </div>
        <p class="card-desc">写下你想说的话，将直接私密投递至博主邮箱。</p>

        <form id="whisper-form">
          <div class="form-group">
            <label class="form-label" for="user-name">用户名</label>
            <input type="text" id="user-name" name="name" class="form-input" placeholder="你的称呼（留空默认为匿名）">
          </div>

          <div class="form-group">
            <label class="form-label" for="user-message">想说的话</label>
            <textarea id="user-message" name="message" class="form-textarea" placeholder="写下你想说的话..." required></textarea>
          </div>

          <button type="submit" class="action-btn" id="submit-btn">
            发送
          </button>
        </form>

        <div class="status-msg" id="status-msg" aria-live="polite"></div>
      </div>

    </div>
  </div>

  <!-- Modular Application Entry -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
