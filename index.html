<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#030308">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>angelic</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- WebGL Background Canvas -->
  <canvas id="glcanvas"></canvas>

  <!-- Side Navigation Dots -->
  <nav class="side-nav" aria-label="Page navigation">
    <button class="nav-dot active" id="dot-0" aria-label="Introduction"></button>
    <button class="nav-dot" id="dot-1" aria-label="Whisper"></button>
  </nav>

  <!-- Scroll Viewport Container -->
  <main class="viewport" id="viewport">
    <div class="scroll-track" id="scroll-track">

      <!-- Section 1: Introduction -->
      <section class="section" id="section-intro">
        <div class="window-card" id="card-intro">
          <h1 class="brand-title">angelic</h1>
          <div class="brand-subtitle">Digital Sanctuary</div>
          <p class="intro-body">
            一个由数学着色器、光线与微观波动交织而成的私人空间。这里没有繁杂的信息流与冗余框架，仅有纯粹色彩在暗夜中的流动与沉淀。
          </p>
          <div class="pill-group">
            <span class="pill">WebGL</span>
            <span class="pill">GLSL</span>
            <span class="pill">Chromatic</span>
            <span class="pill">Minimal</span>
          </div>
          <button type="button" class="action-btn" id="btn-to-whisper">
            悄悄话
          </button>
        </div>
      </section>

      <!-- Section 2: Whisper Window -->
      <section class="section" id="section-whisper">
        <div class="window-card" id="card-whisper">
          <h2 class="brand-title" style="font-size: 1.7rem;">悄悄话</h2>
          <div class="brand-subtitle">Whisper to Owner</div>
          <p class="intro-body" style="margin-bottom: 20px; font-size: 0.88rem;">
            写下你想对我说的话。内容将直接投递至我的私人邮箱，全站无公开展示。
          </p>

          <form id="whisper-form">
            <div class="form-group">
              <label class="form-label" for="sender-name">你的称呼或联系方式（可选）</label>
              <input type="text" id="sender-name" name="name" class="form-input" placeholder="例如：某位访客 / your@email.com">
            </div>

            <div class="form-group">
              <label class="form-label" for="message-content">心事与留言</label>
              <textarea id="message-content" name="message" class="form-textarea" placeholder="在此输入你的悄悄话..." required></textarea>
            </div>

            <button type="submit" class="action-btn" id="submit-btn">
              发送信件
            </button>
          </form>

          <div class="status-msg" id="status-msg" aria-live="polite"></div>

          <a class="secondary-link" id="btn-to-intro" role="button">
            返回介绍
          </a>
        </div>
      </section>

    </div>
  </main>

  <!-- Modular Application Entry -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
