<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#030308">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>angelic</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      background-color: #030308;
      position: fixed;
      inset: 0;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="glcanvas"></canvas>

  <script>
    (function () {
      const canvas = document.getElementById('glcanvas');
      let gl = null;
      let program = null;
      let resolutionLocation = null;
      let timeLocation = null;
      let startTime = performance.now();

      const vsSource = `
        attribute vec2 a_position;
        void main() {
          gl_Position = vec4(a_position, 0.0, 1.0);
        }
      `;

      const fsSource = `
        #ifdef GL_FRAGMENT_PRECISION_HIGH
        precision highp float;
        #else
        precision mediump float;
        #endif

        uniform vec2 u_resolution;
        uniform float u_time;

        float hash(vec2 p) {
          p = fract(p * vec2(123.34, 456.21));
          p += dot(p, p + 45.32);
          return fract(p.x * p.y);
        }

        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
            u.y
          );
        }

        mat2 rot(float a) {
          float s = sin(a);
          float c = cos(a);
          return mat2(c, -s, s, c);
        }

        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.5;
          mat2 r = rot(0.37);
          for (int i = 0; i < 5; i++) {
            v += a * noise(p);
            p = r * p * 2.04;
            a *= 0.5;
          }
          return v;
        }

        void main() {
          vec2 res = u_resolution.xy;
          float minDim = min(res.x, res.y);
          float aspect = res.x / res.y;

          // Normalized centered UV coordinates
          vec2 uv = (gl_FragCoord.xy - 0.5 * res) / minDim;

          // Adaptive framing across mobile vertical screens, tablets, and widescreen displays
          float scale = mix(1.75, 2.35, clamp((aspect - 0.45) / 1.0, 0.0, 1.0));

          float t = u_time * 0.12;
          vec2 p = uv * scale;

          // Domain warping layers
          vec2 q = vec2(
            fbm(p + vec2(0.0, 0.0) + t * 0.28),
            fbm(p + vec2(5.2, 1.3) + t * 0.22)
          );

          vec2 r = vec2(
            fbm(p + 3.8 * q + vec2(1.7, 9.2) + t * 0.32),
            fbm(p + 3.8 * q + vec2(8.3, 2.8) + t * 0.26)
          );

          float f = fbm(p + 3.6 * r + t * 0.22);

          // Celestial & ethereal palette
          vec3 bg = vec3(0.02, 0.02, 0.07);
          vec3 deepIndigo = vec3(0.12, 0.08, 0.32);
          vec3 royalViolet = vec3(0.38, 0.16, 0.68);
          vec3 luminousCyan = vec3(0.15, 0.62, 0.88);
          vec3 angelicAura = vec3(0.96, 0.68, 0.82);
          vec3 starlight = vec3(0.98, 0.96, 0.92);

          vec3 col = mix(bg, deepIndigo, clamp(f * 1.8, 0.0, 1.0));
          col = mix(col, royalViolet, clamp(length(q) * 1.2, 0.0, 1.0));
          col = mix(col, luminousCyan, clamp(length(r.x) * 0.9, 0.0, 1.0));
          col = mix(col, angelicAura, clamp(pow(f, 2.6) * 1.6, 0.0, 1.0));
          col = mix(col, starlight, clamp(pow(f, 4.2) * 2.2, 0.0, 1.0));

          // Screen-space aspect-corrected vignette (avoids over-darkening tall mobile edges)
          vec2 normCoord = (gl_FragCoord.xy / res - 0.5) * 1.35;
          float vignette = clamp(1.0 - dot(normCoord, normCoord), 0.0, 1.0);
          col *= mix(0.55, 1.0, vignette);

          // Dither to prevent color banding
          col += (hash(gl_FragCoord.xy) - 0.5) * (1.0 / 255.0);

          gl_FragColor = vec4(col, 1.0);
        }
      `;

      function createShader(glContext, type, source) {
        const shader = glContext.createShader(type);
        glContext.shaderSource(shader, source);
        glContext.compileShader(shader);
        if (!glContext.getShaderParameter(shader, glContext.COMPILE_STATUS)) {
          console.error(glContext.getShaderInfoLog(shader));
          glContext.deleteShader(shader);
          return null;
        }
        return shader;
      }

      function init() {
        gl = canvas.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' }) ||
             canvas.getContext('experimental-webgl');

        if (!gl) {
          document.body.style.background = 'radial-gradient(ellipse at center, #1b1535 0%, #030308 100%)';
          return false;
        }

        const vertexShader = createShader(gl, gl.VERTEX_SHADER, vsSource);
        const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fsSource);

        if (!vertexShader || !fragmentShader) return false;

        program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          console.error(gl.getProgramInfoLog(program));
          return false;
        }

        gl.useProgram(program);

        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        const positions = new Float32Array([
          -1.0, -1.0,
           3.0, -1.0,
          -1.0,  3.0
        ]);
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

        const positionLocation = gl.getAttribLocation(program, 'a_position');
        gl.enableVertexAttribArray(positionLocation);
        gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

        resolutionLocation = gl.getUniformLocation(program, 'u_resolution');
        timeLocation = gl.getUniformLocation(program, 'u_time');

        resize();
        return true;
      }

      function resize() {
        if (!gl) return;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const displayWidth = Math.floor((window.innerWidth || document.documentElement.clientWidth) * dpr);
        const displayHeight = Math.floor((window.innerHeight || document.documentElement.clientHeight) * dpr);

        if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
          canvas.width = displayWidth;
          canvas.height = displayHeight;
          gl.viewport(0, 0, displayWidth, displayHeight);
        }
      }

      window.addEventListener('resize', resize, { passive: true });
      window.addEventListener('orientationchange', function () {
        setTimeout(resize, 100);
        setTimeout(resize, 300);
      }, { passive: true });

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', resize, { passive: true });
      }

      canvas.addEventListener('webglcontextlost', function (e) {
        e.preventDefault();
      }, false);

      canvas.addEventListener('webglcontextrestored', function () {
        init();
      }, false);

      function render(now) {
        if (gl && program) {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const currentW = Math.floor(window.innerWidth * dpr);
          const currentH = Math.floor(window.innerHeight * dpr);

          if (canvas.width !== currentW || canvas.height !== currentH) {
            resize();
          }

          const time = (now - startTime) * 0.001;
          gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
          gl.uniform1f(timeLocation, time);

          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
        requestAnimationFrame(render);
      }

      if (init()) {
        requestAnimationFrame(render);
      }
    })();
  </script>
</body>
</html>
