<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>angelic</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030308;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="glcanvas"></canvas>

  <script>
    (function () {
      const canvas = document.getElementById('glcanvas');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

      if (!gl) {
        document.body.style.background = 'radial-gradient(ellipse at center, #1b1535 0%, #030308 100%)';
        return;
      }

      const vsSource = `
        attribute vec2 a_position;
        void main() {
          gl_Position = vec4(a_position, 0.0, 1.0);
        }
      `;

      const fsSource = `
        precision highp float;

        uniform vec2 u_resolution;
        uniform vec2 u_mouse;
        uniform float u_time;

        float hash(vec2 p) {
          p = fract(p * vec2(123.34, 456.21));
          p += dot(p, p + 45.32);
          return fract(p.x * p.y);
        }

        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
            u.y
          );
        }

        mat2 rot(float a) {
          float s = sin(a);
          float c = cos(a);
          return mat2(c, -s, s, c);
        }

        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.5;
          mat2 r = rot(0.37);
          for (int i = 0; i < 5; i++) {
            v += a * noise(p);
            p = r * p * 2.04;
            a *= 0.5;
          }
          return v;
        }

        void main() {
          vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / min(u_resolution.x, u_resolution.y);
          vec2 mouse = (u_mouse.xy - 0.5 * u_resolution.xy) / min(u_resolution.x, u_resolution.y);

          // Interaction ripple & distortion
          float d = length(uv - mouse);
          vec2 mouseDistort = (uv - mouse) * exp(-d * 3.5) * 0.45;

          float t = u_time * 0.12;
          vec2 p = uv * 2.4 + mouseDistort;

          // Domain warping layers
          vec2 q = vec2(
            fbm(p + vec2(0.0, 0.0) + t * 0.3),
            fbm(p + vec2(5.2, 1.3) + t * 0.22)
          );

          vec2 r = vec2(
            fbm(p + 4.0 * q + vec2(1.7, 9.2) + t * 0.35),
            fbm(p + 4.0 * q + vec2(8.3, 2.8) + t * 0.28)
          );

          float f = fbm(p + 3.8 * r + t * 0.25);

          // Celestial & ethereal palette
          vec3 bg = vec3(0.02, 0.02, 0.07);
          vec3 deepIndigo = vec3(0.12, 0.08, 0.32);
          vec3 royalViolet = vec3(0.38, 0.16, 0.68);
          vec3 luminousCyan = vec3(0.15, 0.62, 0.88);
          vec3 angelicAura = vec3(0.96, 0.68, 0.82);
          vec3 starlight = vec3(0.98, 0.96, 0.92);

          vec3 col = mix(bg, deepIndigo, clamp(f * 1.8, 0.0, 1.0));
          col = mix(col, royalViolet, clamp(length(q) * 1.2, 0.0, 1.0));
          col = mix(col, luminousCyan, clamp(length(r.x) * 0.9, 0.0, 1.0));
          col = mix(col, angelicAura, clamp(pow(f, 2.6) * 1.6, 0.0, 1.0));
          col = mix(col, starlight, clamp(pow(f, 4.2) * 2.2, 0.0, 1.0));

          // Soft ambient vignette
          float vignette = 1.0 - 0.45 * dot(uv, uv);
          col *= clamp(vignette, 0.0, 1.0);

          // Dither to prevent color banding
          col += (hash(gl_FragCoord.xy) - 0.5) * (1.0 / 255.0);

          gl_FragColor = vec4(col, 1.0);
        }
      `;

      function createShader(gl, type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          console.error(gl.getShaderInfoLog(shader));
          gl.deleteShader(shader);
          return null;
        }
        return shader;
      }

      const vertexShader = createShader(gl, gl.VERTEX_SHADER, vsSource);
      const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fsSource);

      if (!vertexShader || !fragmentShader) return;

      const program = gl.createProgram();
      gl.attachShader(program, vertexShader);
      gl.attachShader(program, fragmentShader);
      gl.linkProgram(program);

      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error(gl.getProgramInfoLog(program));
        return;
      }

      gl.useProgram(program);

      // Oversized screen-covering triangle
      const positionBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      const positions = new Float32Array([
        -1.0, -1.0,
         3.0, -1.0,
        -1.0,  3.0
      ]);
      gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

      const positionLocation = gl.getAttribLocation(program, 'a_position');
      gl.enableVertexAttribArray(positionLocation);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      const resolutionLocation = gl.getUniformLocation(program, 'u_resolution');
      const mouseLocation = gl.getUniformLocation(program, 'u_mouse');
      const timeLocation = gl.getUniformLocation(program, 'u_time');

      let targetMouse = { x: window.innerWidth * 0.5, y: window.innerHeight * 0.5 };
      let currentMouse = { x: window.innerWidth * 0.5, y: window.innerHeight * 0.5 };
      let hasInteracted = false;

      function updateMouse(e) {
        hasInteracted = true;
        const rect = canvas.getBoundingClientRect();
        targetMouse.x = (e.clientX - rect.left) * (canvas.width / rect.width);
        targetMouse.y = (rect.height - (e.clientY - rect.top)) * (canvas.height / rect.height);
      }

      window.addEventListener('pointermove', updateMouse, { passive: true });
      window.addEventListener('pointerdown', updateMouse, { passive: true });

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const width = Math.floor(window.innerWidth * dpr);
        const height = Math.floor(window.innerHeight * dpr);

        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
          gl.viewport(0, 0, width, height);
          if (!hasInteracted) {
            targetMouse.x = width * 0.5;
            targetMouse.y = height * 0.5;
            currentMouse.x = width * 0.5;
            currentMouse.y = height * 0.5;
          }
        }
      }

      window.addEventListener('resize', resize);
      resize();

      const startTime = performance.now();

      function render(now) {
        const time = (now - startTime) * 0.001;

        if (!hasInteracted) {
          // Subtle celestial idle float
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const cx = (window.innerWidth * 0.5 + Math.sin(time * 0.8) * 120) * dpr;
          const cy = (window.innerHeight * 0.5 + Math.cos(time * 0.6) * 100) * dpr;
          targetMouse.x = cx;
          targetMouse.y = cy;
        }

        currentMouse.x += (targetMouse.x - currentMouse.x) * 0.06;
        currentMouse.y += (targetMouse.y - currentMouse.y) * 0.06;

        gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
        gl.uniform2f(mouseLocation, currentMouse.x, currentMouse.y);
        gl.uniform1f(timeLocation, time);

        gl.drawArrays(gl.TRIANGLES, 0, 3);
        requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
