<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#030308">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>angelic</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      background-color: #030308;
      position: fixed;
      inset: 0;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="glcanvas"></canvas>

  <script>
    (function () {
      const canvas = document.getElementById('glcanvas');
      let gl = null;
      let program = null;
      let resolutionLocation = null;
      let timeLocation = null;
      let mouseLocation = null;
      let startTime = performance.now();

      const vsSource = `
        attribute vec2 a_position;
        void main() {
          gl_Position = vec4(a_position, 0.0, 1.0);
        }
      `;

      const fsSource = `
        #ifdef GL_FRAGMENT_PRECISION_HIGH
        precision highp float;
        #else
        precision mediump float;
        #endif

        uniform vec3 iResolution;
        uniform float iTime;
        uniform vec4 iMouse;

        #define PI  3.14159265359
        #define TAU 6.28318530718

        mat2 rot(float a) {
            float c = cos(a), s = sin(a);
            return mat2(c, -s, s, c);
        }

        float hash21(vec2 p) {
            p = fract(p * vec2(123.34, 456.21));
            p += dot(p, p + 45.32);
            return fract(p.x * p.y);
        }

        float noise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            vec2 u = f * f * (3.0 - 2.0 * f);
            float a = hash21(i);
            float b = hash21(i + vec2(1.0, 0.0));
            float c = hash21(i + vec2(0.0, 1.0));
            float d = hash21(i + vec2(1.0, 1.0));
            return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
        }

        float fbm(vec2 p) {
            float v = 0.0, amp = 0.5;
            for (int i = 0; i < 5; i++) {
                v   += amp * noise(p);
                p    = rot(0.53) * p * 2.03;
                amp *= 0.5;
            }
            return v;
        }

        vec3 scene(vec2 uv, float t) {
            vec2 q = vec2(fbm(uv * 1.6 + vec2(0.0, 0.15 * t)),
                          fbm(uv * 1.6 + vec2(5.2, 1.3) - 0.10 * t));

            vec2 r = vec2(fbm(uv * 1.6 + 3.5 * q + vec2(1.7, 9.2) + 0.12 * t),
                          fbm(uv * 1.6 + 3.5 * q + vec2(8.3, 2.8) - 0.09 * t));

            float f = fbm(uv * 1.6 + 3.0 * r);

            vec3 col = mix(vec3(0.015, 0.025, 0.075),
                           vec3(0.10,  0.55,  0.95), clamp(f * f * 4.0, 0.0, 1.0));

            col = mix(col, vec3(0.95, 0.30, 0.62), clamp(length(q), 0.0, 1.0));
            col = mix(col, vec3(1.00, 0.88, 0.35), clamp(r.x * r.x, 0.0, 1.0));

            float phase = 11.0 * length(uv - 0.35 * vec2(cos(0.6 * t), sin(0.6 * t))) - 3.5 * f;
            col += 0.14 * sin(phase);

            col += 0.02 * (hash21(uv * 700.0 + t) - 0.5);

            return max(col, 0.0);
        }

        vec3 chromatic(vec2 uv, vec2 lensCenter, float t) {
            vec2 d  = uv - lensCenter;
            float r2 = dot(d, d);

            vec2 cuv = lensCenter + d * (1.0 + 0.18 * r2);

            float ca = (0.006 + 0.055 * r2) * (1.0 + 0.35 * sin(0.7 * t));

            vec2 axis = normalize(d + 1e-5) + 0.35 * iMouse.xy / iResolution.xy;

            vec3 col;
            col.r = scene(cuv + axis * ca * 1.6, t).r;
            col.g = scene(cuv,                  t).g;
            col.b = scene(cuv - axis * ca * 1.6, t).b;

            col.r = mix(col.r, scene(cuv + axis * ca * 0.8, t).g, 0.08);
            col.b = mix(col.b, scene(cuv - axis * ca * 0.8, t).g, 0.08);

            return col;
        }

        void mainImage(out vec4 fragColor, in vec2 fragCoord) {
            float t = iTime;

            float aspect = iResolution.x / iResolution.y;
            float refDim = aspect < 1.0 ? mix(iResolution.x, iResolution.y, 0.3) : iResolution.y;
            vec2 uv = (2.0 * fragCoord - iResolution.xy) / refDim;

            vec2 lensCenter = 0.22 * vec2(cos(0.23 * t), sin(0.31 * t));
            if (iMouse.z > 0.0) {
                vec2 m = (2.0 * iMouse.xy - iResolution.xy) / refDim;
                lensCenter = mix(lensCenter, 0.55 * m, 0.65);
            }

            vec3 col = chromatic(uv, lensCenter, t);

            float vigRadius = aspect < 1.0 ? 2.1 : 1.7;
            float vig = smoothstep(vigRadius, 0.25, length(uv - lensCenter));
            col *= 0.35 + 0.65 * vig;

            col = col / (1.0 + col);
            col = pow(col, vec3(0.4545));

            col += (hash21(fragCoord + fract(t)) - 0.5) / 255.0;

            fragColor = vec4(col, 1.0);
        }

        void main() {
            mainImage(gl_FragColor, gl_FragCoord.xy);
        }
      `;

      function createShader(glContext, type, source) {
        const shader = glContext.createShader(type);
        glContext.shaderSource(shader, source);
        glContext.compileShader(shader);
        if (!glContext.getShaderParameter(shader, glContext.COMPILE_STATUS)) {
          console.error(glContext.getShaderInfoLog(shader));
          glContext.deleteShader(shader);
          return null;
        }
        return shader;
      }

      function init() {
        gl = canvas.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' }) ||
             canvas.getContext('experimental-webgl');

        if (!gl) {
          document.body.style.background = 'radial-gradient(ellipse at center, #1b1535 0%, #030308 100%)';
          return false;
        }

        const vertexShader = createShader(gl, gl.VERTEX_SHADER, vsSource);
        const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fsSource);

        if (!vertexShader || !fragmentShader) return false;

        program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          console.error(gl.getProgramInfoLog(program));
          return false;
        }

        gl.useProgram(program);

        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        const positions = new Float32Array([
          -1.0, -1.0,
           3.0, -1.0,
          -1.0,  3.0
        ]);
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

        const positionLocation = gl.getAttribLocation(program, 'a_position');
        gl.enableVertexAttribArray(positionLocation);
        gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

        resolutionLocation = gl.getUniformLocation(program, 'iResolution');
        timeLocation = gl.getUniformLocation(program, 'iTime');
        mouseLocation = gl.getUniformLocation(program, 'iMouse');

        resize();
        return true;
      }

      function resize() {
        if (!gl) return;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const displayWidth = Math.floor((window.innerWidth || document.documentElement.clientWidth) * dpr);
        const displayHeight = Math.floor((window.innerHeight || document.documentElement.clientHeight) * dpr);

        if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
          canvas.width = displayWidth;
          canvas.height = displayHeight;
          gl.viewport(0, 0, displayWidth, displayHeight);
        }
      }

      window.addEventListener('resize', resize, { passive: true });
      window.addEventListener('orientationchange', function () {
        setTimeout(resize, 100);
        setTimeout(resize, 300);
      }, { passive: true });

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', resize, { passive: true });
      }

      canvas.addEventListener('webglcontextlost', function (e) {
        e.preventDefault();
      }, false);

      canvas.addEventListener('webglcontextrestored', function () {
        init();
      }, false);

      function render(now) {
        if (gl && program) {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const currentW = Math.floor(window.innerWidth * dpr);
          const currentH = Math.floor(window.innerHeight * dpr);

          if (canvas.width !== currentW || canvas.height !== currentH) {
            resize();
          }

          const time = (now - startTime) * 0.001;
          gl.uniform3f(resolutionLocation, canvas.width, canvas.height, 1.0);
          gl.uniform1f(timeLocation, time);
          gl.uniform4f(mouseLocation, 0.0, 0.0, 0.0, 0.0);

          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
        requestAnimationFrame(render);
      }

      if (init()) {
        requestAnimationFrame(render);
      }
    })();
  </script>
</body>
</html>
