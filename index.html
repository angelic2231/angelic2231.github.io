<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#030308">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>angelic</title>
  <style>
    :root {
      --bg-dark: #030308;
      --card-bg: rgba(13, 15, 27, 0.52);
      --card-border: rgba(255, 255, 255, 0.13);
      --card-bloom: 0 0 55px rgba(130, 90, 255, 0.25), 0 0 110px rgba(40, 160, 255, 0.16), 0 30px 60px -12px rgba(0, 0, 0, 0.8);
      --card-bloom-hover: 0 0 75px rgba(140, 100, 255, 0.35), 0 0 135px rgba(50, 180, 255, 0.22), 0 35px 70px -12px rgba(0, 0, 0, 0.85);
      --card-inner-glow: inset 0 1px 1px rgba(255, 255, 255, 0.3), inset 0 0 24px rgba(150, 120, 255, 0.08);
      --text-primary: #f6f7fb;
      --text-secondary: rgba(230, 235, 250, 0.68);
      --text-muted: rgba(200, 210, 235, 0.45);
      --accent-glow: rgba(130, 170, 255, 0.5);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Fixed WebGL Canvas Background */
    #glcanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: block;
      z-index: 0;
      pointer-events: none;
    }

    /* Scroll Viewport: Fluid Continuous Scroll (Lenis Physics) */
    .viewport {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 10;
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
    }
    .viewport::-webkit-scrollbar {
      display: none;
    }

    /* Scroll Track with generous spatial depth */
    .scroll-track {
      position: relative;
      width: 100%;
      min-height: 200dvh;
    }

    /* Sections */
    .section {
      width: 100%;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      position: relative;
    }

    /* Glassmorphic Card Window */
    .window-card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      box-shadow: var(--card-bloom), var(--card-inner-glow);
      backdrop-filter: blur(30px) saturate(185%);
      -webkit-backdrop-filter: blur(30px) saturate(185%);
      padding: 38px 34px;
      position: relative;
      overflow: hidden;
      will-change: transform, opacity, filter;
      transition: box-shadow 0.4s ease, border-color 0.4s ease;
    }

    .window-card:hover {
      box-shadow: var(--card-bloom-hover), var(--card-inner-glow);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Top Specular Gradient Highlight */
    .window-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
      pointer-events: none;
    }

    /* Typography */
    .brand-title {
      font-size: 2.15rem;
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.15;
      margin-bottom: 6px;
      color: #ffffff;
      text-shadow: 0 0 24px var(--accent-glow);
    }

    .brand-subtitle {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      margin-bottom: 22px;
    }

    .intro-body {
      font-size: 0.95rem;
      line-height: 1.72;
      color: var(--text-secondary);
      margin-bottom: 26px;
    }

    .pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 32px;
    }

    .pill {
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-secondary);
      backdrop-filter: blur(12px);
    }

    /* Buttons */
    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 13px 20px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.06));
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 14px;
      color: #ffffff;
      font-size: 0.92rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 24px rgba(130, 90, 255, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .action-btn:hover {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.1));
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 34px rgba(140, 100, 255, 0.36), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      transform: translateY(-1px);
    }

    .action-btn:active {
      transform: translateY(0);
    }

    .secondary-link {
      display: inline-block;
      margin-top: 20px;
      font-size: 0.84rem;
      color: var(--text-muted);
      text-decoration: none;
      cursor: pointer;
      transition: color 0.25s ease;
    }

    .secondary-link:hover {
      color: var(--text-primary);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      letter-spacing: 0.03em;
      color: var(--text-secondary);
      margin-bottom: 7px;
    }

    .form-input, .form-textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 0.92rem;
      outline: none;
      transition: all 0.25s ease;
      font-family: inherit;
    }

    .form-textarea {
      resize: none;
      height: 105px;
      line-height: 1.5;
    }

    .form-input::placeholder, .form-textarea::placeholder {
      color: rgba(200, 210, 235, 0.3);
    }

    .form-input:focus, .form-textarea:focus {
      border-color: rgba(140, 180, 255, 0.55);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 22px rgba(120, 160, 255, 0.25);
    }

    /* Status Banner */
    .status-msg {
      margin-top: 14px;
      font-size: 0.85rem;
      line-height: 1.5;
      min-height: 20px;
      transition: all 0.3s ease;
    }
    .status-msg.success {
      color: #72e2ae;
      text-shadow: 0 0 12px rgba(114, 226, 174, 0.4);
    }
    .status-msg.error {
      color: #ff758c;
      text-shadow: 0 0 12px rgba(255, 117, 140, 0.4);
    }
    .status-msg.loading {
      color: rgba(200, 220, 255, 0.7);
    }

    /* Navigation Side Dots */
    .side-nav {
      position: fixed;
      right: 22px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 100;
    }

    .nav-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.22);
      border: none;
      cursor: pointer;
      padding: 0;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .nav-dot.active {
      height: 24px;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 0 16px rgba(140, 190, 255, 0.85), 0 0 30px rgba(140, 190, 255, 0.4);
    }

    @media (max-width: 480px) {
      .window-card {
        padding: 28px 22px;
        border-radius: 24px;
      }
      .brand-title {
        font-size: 1.8rem;
      }
      .side-nav {
        right: 12px;
      }
    }
  </style>
</head>
<body>
  <!-- WebGL Chromatic Canvas -->
  <canvas id="glcanvas"></canvas>

  <!-- Side Navigation Dots -->
  <nav class="side-nav" aria-label="Page navigation">
    <button class="nav-dot active" id="dot-0" aria-label="Introduction"></button>
    <button class="nav-dot" id="dot-1" aria-label="Whisper"></button>
  </nav>

  <!-- Scroll Viewport Container -->
  <main class="viewport" id="viewport">
    <div class="scroll-track" id="scroll-track">
      
      <!-- Section 1: Introduction -->
      <section class="section" id="section-intro">
        <div class="window-card" id="card-intro">
          <h1 class="brand-title">angelic</h1>
          <div class="brand-subtitle">Digital Sanctuary</div>
          <p class="intro-body">
            一个由数学着色器、光线与微观波动交织而成的私人空间。这里没有繁杂的信息流与冗余框架，仅有纯粹色彩在暗夜中的流动与沉淀。
          </p>
          <div class="pill-group">
            <span class="pill">WebGL</span>
            <span class="pill">GLSL</span>
            <span class="pill">Chromatic</span>
            <span class="pill">Minimal</span>
          </div>
          <button type="button" class="action-btn" id="btn-to-whisper">
            悄悄话
          </button>
        </div>
      </section>

      <!-- Section 2: Whisper Window -->
      <section class="section" id="section-whisper">
        <div class="window-card" id="card-whisper">
          <h2 class="brand-title" style="font-size: 1.7rem;">悄悄话</h2>
          <div class="brand-subtitle">Whisper to Owner</div>
          <p class="intro-body" style="margin-bottom: 20px; font-size: 0.88rem;">
            写下你想对我说的话。内容将直接投递至我的私人邮箱，全站无公开展示。
          </p>

          <form id="whisper-form">
            <div class="form-group">
              <label class="form-label" for="sender-name">你的称呼或联系方式（可选）</label>
              <input type="text" id="sender-name" name="name" class="form-input" placeholder="例如：某位访客 / your@email.com">
            </div>

            <div class="form-group">
              <label class="form-label" for="message-content">心事与留言</label>
              <textarea id="message-content" name="message" class="form-textarea" placeholder="在此输入你的悄悄话..." required></textarea>
            </div>

            <button type="submit" class="action-btn" id="submit-btn">
              发送信件
            </button>
          </form>

          <div class="status-msg" id="status-msg" aria-live="polite"></div>

          <a class="secondary-link" id="btn-to-intro" role="button">
            返回介绍
          </a>
        </div>
      </section>

    </div>
  </main>

  <script>
    /* ==========================================================================
       1. Chromatic WebGL Shader Engine
       ========================================================================== */
    (function () {
      const canvas = document.getElementById('glcanvas');
      let gl = null;
      let program = null;
      let resolutionLocation = null;
      let timeLocation = null;
      let mouseLocation = null;
      let startTime = performance.now();

      const vsSource = `
        attribute vec2 a_position;
        void main() {
          gl_Position = vec4(a_position, 0.0, 1.0);
        }
      `;

      const fsSource = `
        #ifdef GL_FRAGMENT_PRECISION_HIGH
        precision highp float;
        #else
        precision mediump float;
        #endif

        uniform vec3 iResolution;
        uniform float iTime;
        uniform vec4 iMouse;

        #define PI  3.14159265359
        #define TAU 6.28318530718

        mat2 rot(float a) {
            float c = cos(a), s = sin(a);
            return mat2(c, -s, s, c);
        }

        float hash21(vec2 p) {
            p = fract(p * vec2(123.34, 456.21));
            p += dot(p, p + 45.32);
            return fract(p.x * p.y);
        }

        float noise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            vec2 u = f * f * (3.0 - 2.0 * f);
            float a = hash21(i);
            float b = hash21(i + vec2(1.0, 0.0));
            float c = hash21(i + vec2(0.0, 1.0));
            float d = hash21(i + vec2(1.0, 1.0));
            return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
        }

        float fbm(vec2 p) {
            float v = 0.0, amp = 0.5;
            for (int i = 0; i < 5; i++) {
                v   += amp * noise(p);
                p    = rot(0.53) * p * 2.03;
                amp *= 0.5;
            }
            return v;
        }

        vec3 scene(vec2 uv, float t) {
            vec2 q = vec2(fbm(uv * 1.6 + vec2(0.0, 0.15 * t)),
                          fbm(uv * 1.6 + vec2(5.2, 1.3) - 0.10 * t));

            vec2 r = vec2(fbm(uv * 1.6 + 3.5 * q + vec2(1.7, 9.2) + 0.12 * t),
                          fbm(uv * 1.6 + 3.5 * q + vec2(8.3, 2.8) - 0.09 * t));

            float f = fbm(uv * 1.6 + 3.0 * r);

            vec3 col = mix(vec3(0.015, 0.025, 0.075),
                           vec3(0.10,  0.55,  0.95), clamp(f * f * 4.0, 0.0, 1.0));

            col = mix(col, vec3(0.95, 0.30, 0.62), clamp(length(q), 0.0, 1.0));
            col = mix(col, vec3(1.00, 0.88, 0.35), clamp(r.x * r.x, 0.0, 1.0));

            float phase = 11.0 * length(uv - 0.35 * vec2(cos(0.6 * t), sin(0.6 * t))) - 3.5 * f;
            col += 0.14 * sin(phase);

            col += 0.02 * (hash21(uv * 700.0 + t) - 0.5);

            return max(col, 0.0);
        }

        vec3 chromatic(vec2 uv, vec2 lensCenter, float t) {
            vec2 d  = uv - lensCenter;
            float r2 = dot(d, d);

            vec2 cuv = lensCenter + d * (1.0 + 0.18 * r2);

            float ca = (0.006 + 0.055 * r2) * (1.0 + 0.35 * sin(0.7 * t));

            vec2 axis = normalize(d + 1e-5) + 0.35 * iMouse.xy / iResolution.xy;

            vec3 col;
            col.r = scene(cuv + axis * ca * 1.6, t).r;
            col.g = scene(cuv,                  t).g;
            col.b = scene(cuv - axis * ca * 1.6, t).b;

            col.r = mix(col.r, scene(cuv + axis * ca * 0.8, t).g, 0.08);
            col.b = mix(col.b, scene(cuv - axis * ca * 0.8, t).g, 0.08);

            return col;
        }

        void mainImage(out vec4 fragColor, in vec2 fragCoord) {
            float t = iTime;

            float aspect = iResolution.x / iResolution.y;
            float refDim = aspect < 1.0 ? mix(iResolution.x, iResolution.y, 0.3) : iResolution.y;
            vec2 uv = (2.0 * fragCoord - iResolution.xy) / refDim;

            vec2 lensCenter = 0.22 * vec2(cos(0.23 * t), sin(0.31 * t));
            if (iMouse.z > 0.0) {
                vec2 m = (2.0 * iMouse.xy - iResolution.xy) / refDim;
                lensCenter = mix(lensCenter, 0.55 * m, 0.65);
            }

            vec3 col = chromatic(uv, lensCenter, t);

            float vigRadius = aspect < 1.0 ? 2.1 : 1.7;
            float vig = smoothstep(vigRadius, 0.25, length(uv - lensCenter));
            col *= 0.35 + 0.65 * vig;

            col = col / (1.0 + col);
            col = pow(col, vec3(0.4545));

            col += (hash21(fragCoord + fract(t)) - 0.5) / 255.0;

            fragColor = vec4(col, 1.0);
        }

        void main() {
            mainImage(gl_FragColor, gl_FragCoord.xy);
        }
      `;

      function createShader(glContext, type, source) {
        const shader = glContext.createShader(type);
        glContext.shaderSource(shader, source);
        glContext.compileShader(shader);
        if (!glContext.getShaderParameter(shader, glContext.COMPILE_STATUS)) {
          console.error(glContext.getShaderInfoLog(shader));
          glContext.deleteShader(shader);
          return null;
        }
        return shader;
      }

      function init() {
        gl = canvas.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' }) ||
             canvas.getContext('experimental-webgl');

        if (!gl) {
          document.body.style.background = 'radial-gradient(ellipse at center, #1b1535 0%, #030308 100%)';
          return false;
        }

        const vertexShader = createShader(gl, gl.VERTEX_SHADER, vsSource);
        const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fsSource);

        if (!vertexShader || !fragmentShader) return false;

        program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          console.error(gl.getProgramInfoLog(program));
          return false;
        }

        gl.useProgram(program);

        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        const positions = new Float32Array([
          -1.0, -1.0,
           3.0, -1.0,
          -1.0,  3.0
        ]);
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

        const positionLocation = gl.getAttribLocation(program, 'a_position');
        gl.enableVertexAttribArray(positionLocation);
        gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

        resolutionLocation = gl.getUniformLocation(program, 'iResolution');
        timeLocation = gl.getUniformLocation(program, 'iTime');
        mouseLocation = gl.getUniformLocation(program, 'iMouse');

        resize();
        return true;
      }

      function resize() {
        if (!gl) return;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const displayWidth = Math.floor((window.innerWidth || document.documentElement.clientWidth) * dpr);
        const displayHeight = Math.floor((window.innerHeight || document.documentElement.clientHeight) * dpr);

        if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
          canvas.width = displayWidth;
          canvas.height = displayHeight;
          gl.viewport(0, 0, displayWidth, displayHeight);
        }
      }

      window.addEventListener('resize', resize, { passive: true });
      window.addEventListener('orientationchange', function () {
        setTimeout(resize, 100);
        setTimeout(resize, 300);
      }, { passive: true });

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', resize, { passive: true });
      }

      canvas.addEventListener('webglcontextlost', function (e) {
        e.preventDefault();
      }, false);

      canvas.addEventListener('webglcontextrestored', function () {
        init();
      }, false);

      function render(now) {
        if (gl && program) {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const currentW = Math.floor(window.innerWidth * dpr);
          const currentH = Math.floor(window.innerHeight * dpr);

          if (canvas.width !== currentW || canvas.height !== currentH) {
            resize();
          }

          const time = (now - startTime) * 0.001;
          gl.uniform3f(resolutionLocation, canvas.width, canvas.height, 1.0);
          gl.uniform1f(timeLocation, time);
          gl.uniform4f(mouseLocation, 0.0, 0.0, 0.0, 0.0);

          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
        requestAnimationFrame(render);
      }

      if (init()) {
        requestAnimationFrame(render);
      }
    })();


    /* ==========================================================================
       2. Natural Inertial Momentum Scroll & Spatial Card Transition
       ========================================================================== */
    (function () {
      const viewport = document.getElementById('viewport');
      const cardIntro = document.getElementById('card-intro');
      const cardWhisper = document.getElementById('card-whisper');
      const dots = [
        document.getElementById('dot-0'),
        document.getElementById('dot-1')
      ];
      const btnToWhisper = document.getElementById('btn-to-whisper');
      const btnToIntro = document.getElementById('btn-to-intro');

      let targetScroll = viewport.scrollTop;
      let currentScroll = viewport.scrollTop;
      let isLerping = false;
      let isTouch = false;

      // Update spatial card transitions based on continuous scroll progress
      function updateSpatialCards() {
        const vh = viewport.clientHeight || window.innerHeight;
        const scrollY = viewport.scrollTop;
        const progress = Math.max(0, Math.min(1, scrollY / vh));

        // Card 1: Introduction (dissolves and glides up smoothly)
        const introOpacity = Math.max(0, 1 - progress * 1.5);
        const introY = -progress * 90;
        const introScale = 1 - progress * 0.07;
        const introBlur = progress * 10;
        cardIntro.style.transform = `translate3d(0, ${introY}px, 0) scale(${introScale})`;
        cardIntro.style.opacity = introOpacity;
        cardIntro.style.filter = introBlur > 0.1 ? `blur(${introBlur}px)` : 'none';
        cardIntro.style.pointerEvents = progress > 0.5 ? 'none' : 'auto';

        // Card 2: Whisper (emerges and ascends from below with bloom clarity)
        const whisperOpacity = Math.max(0, Math.min(1, (progress - 0.15) / 0.75));
        const whisperY = (1 - progress) * 90;
        const whisperScale = 0.93 + progress * 0.07;
        const whisperBlur = (1 - progress) * 10;
        cardWhisper.style.transform = `translate3d(0, ${whisperY}px, 0) scale(${whisperScale})`;
        cardWhisper.style.opacity = whisperOpacity;
        cardWhisper.style.filter = whisperBlur > 0.1 ? `blur(${whisperBlur}px)` : 'none';
        cardWhisper.style.pointerEvents = progress < 0.5 ? 'none' : 'auto';

        // Active side navigation indicator
        const activeIndex = progress > 0.5 ? 1 : 0;
        dots[0].classList.toggle('active', activeIndex === 0);
        dots[1].classList.toggle('active', activeIndex === 1);
      }

      // Smooth inertia momentum loop (desktop mouse wheel)
      function lerpLoop() {
        if (!isLerping) return;
        const diff = targetScroll - currentScroll;
        if (Math.abs(diff) > 0.5) {
          currentScroll += diff * 0.09; // Buttery organic damping
          viewport.scrollTop = currentScroll;
          updateSpatialCards();
          requestAnimationFrame(lerpLoop);
        } else {
          currentScroll = targetScroll;
          viewport.scrollTop = currentScroll;
          updateSpatialCards();
          isLerping = false;
        }
      }

      function smoothScrollTo(y) {
        const maxScroll = viewport.scrollHeight - viewport.clientHeight;
        targetScroll = Math.max(0, Math.min(maxScroll, y));
        if (!isLerping) {
          isLerping = true;
          currentScroll = viewport.scrollTop;
          requestAnimationFrame(lerpLoop);
        }
      }

      // Mobile Touch: 100% native smooth momentum physics
      viewport.addEventListener('touchstart', () => {
        isTouch = true;
        isLerping = false;
        targetScroll = currentScroll = viewport.scrollTop;
      }, { passive: true });

      viewport.addEventListener('scroll', () => {
        if (!isLerping) {
          targetScroll = currentScroll = viewport.scrollTop;
          updateSpatialCards();
        }
      }, { passive: true });

      // Desktop Mouse Wheel: Lenis-style continuous momentum
      viewport.addEventListener('wheel', (e) => {
        if (isTouch) isTouch = false;

        // Allow natural internal scrolling inside textarea
        if (e.target && e.target.closest && e.target.closest('.form-textarea')) {
          const ta = e.target.closest('.form-textarea');
          if (ta.scrollHeight > ta.clientHeight) return;
        }

        // Horizontal gestures (e.g. Mac swipe) preserved
        if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;

        const maxScroll = viewport.scrollHeight - viewport.clientHeight;
        targetScroll = Math.max(0, Math.min(maxScroll, targetScroll + e.deltaY * 0.85));

        if (!isLerping) {
          isLerping = true;
          currentScroll = viewport.scrollTop;
          requestAnimationFrame(lerpLoop);
        }
        e.preventDefault();
      }, { passive: false });

      // Click Navigations
      dots[0].addEventListener('click', () => smoothScrollTo(0));
      dots[1].addEventListener('click', () => smoothScrollTo(viewport.clientHeight));
      btnToWhisper.addEventListener('click', (e) => {
        e.preventDefault();
        smoothScrollTo(viewport.clientHeight);
      });
      btnToIntro.addEventListener('click', (e) => {
        e.preventDefault();
        smoothScrollTo(0);
      });

      // Keyboard arrow keys navigation
      window.addEventListener('keydown', (e) => {
        if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) {
          return;
        }
        if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') {
          e.preventDefault();
          smoothScrollTo(viewport.clientHeight);
        } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
          e.preventDefault();
          smoothScrollTo(0);
        }
      });

      // Initial layout update
      updateSpatialCards();
    })();


    /* ==========================================================================
       3. Whisper Form Submission (Web3Forms API)
       ========================================================================== */
    (function () {
      const form = document.getElementById('whisper-form');
      const submitBtn = document.getElementById('submit-btn');
      const statusMsg = document.getElementById('status-msg');
      const messageInput = document.getElementById('message-content');
      const nameInput = document.getElementById('sender-name');

      form.addEventListener('submit', async function (e) {
        e.preventDefault();

        const message = messageInput.value.trim();
        const name = nameInput.value.trim() || '匿名访客';

        if (!message) {
          statusMsg.className = 'status-msg error';
          statusMsg.textContent = '请输入留言内容。';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.style.opacity = '0.6';
        statusMsg.className = 'status-msg loading';
        statusMsg.textContent = '正在投递信件...';

        try {
          const response = await fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({
              access_key: '8f2c9af3-1017-40b7-8ccd-9409fa5dcbfd',
              name: name,
              message: message,
              subject: '来自 angelic.today 的新悄悄话'
            })
          });

          const data = await response.json();

          if (data.success) {
            statusMsg.className = 'status-msg success';
            statusMsg.textContent = '信件已成功送达博主邮箱。';
            form.reset();
          } else {
            statusMsg.className = 'status-msg error';
            statusMsg.textContent = data.message || '发送失败，请稍后重试。';
          }
        } catch (err) {
          statusMsg.className = 'status-msg error';
          statusMsg.textContent = '网络连接异常，发送失败。';
        } finally {
          submitBtn.disabled = false;
          submitBtn.style.opacity = '1';
        }
      });
    })();
  </script>
